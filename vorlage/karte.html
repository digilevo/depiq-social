<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Zentrale Vorlage für alle depiq-Social-Bilder. Inhalte stehen in posts.js, Formate (ig, x) unten in FORMATE. -->
<style>
@font-face{font-family:'DM Sans';font-weight:400;src:url(schrift/dm-sans-400.woff2)}
@font-face{font-family:'DM Sans';font-weight:500;src:url(schrift/dm-sans-500.woff2)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(schrift/dm-sans-700.woff2)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
@font-face{font-family:'JB';font-weight:700;src:url(schrift/jetbrains-mono-700.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0f1338;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 65% 45% at 8% 4%, rgba(124,92,230,.9), rgba(124,92,230,0) 70%),
 radial-gradient(ellipse 60% 45% at 100% 100%, var(--glow), transparent 70%),
 linear-gradient(160deg,#1b1752 0%,#11143c 45%,#0d1636 100%)}
.raster{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:var(--rasterweite) var(--rasterweite);mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%)}
.inhalt{position:absolute;inset:0;padding:var(--pad);display:flex;flex-direction:column}
.kopf{display:flex;justify-content:space-between;align-items:center}
.kopf img{height:var(--logo)}
.chip{display:inline-flex;align-items:center;gap:.45em;font-size:var(--chip);font-weight:700;padding:.5em 1em;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);color:#e7e8ff}
.chip svg{width:1.15em;height:1.15em}
.mitte{flex:1;padding-block:var(--mittepad,28px);display:flex;flex-direction:column;justify-content:center;gap:var(--abst)}
h1{font-size:var(--titel);font-weight:800;line-height:1.02;letter-spacing:-.025em}
h1 em{font-style:normal;background:linear-gradient(90deg,#c4b5fd,#7ee7d8);-webkit-background-clip:text;color:transparent}
.unter{font-size:var(--unter);line-height:1.3;color:#d4d6fb;max-width:var(--unterbreite)}
.liste{display:flex;flex-direction:column;gap:var(--listenabst)}
.punkt{display:flex;align-items:center;gap:.6em;font-size:var(--liste);font-weight:500}
.punkt i{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:linear-gradient(135deg,#6366f1,#14b8a6);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:'JB';font-size:.8em}
.punkt i svg{width:.8em;height:.8em}
.cta{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:var(--ctapad);border-radius:var(--ctarad);background:linear-gradient(90deg,#6d5ef5,#4f7be8 50%,#14b8a6);box-shadow:0 18px 60px rgba(20,184,166,.28)}
.cta .links{display:flex;align-items:center;gap:.5em;font-size:var(--cta);font-weight:800}
.cta .links svg{width:1.1em;height:1.1em;flex:none}
.cta .rechts{display:flex;align-items:center;gap:.4em;font-family:'JB';font-size:var(--ctaurl);font-weight:700;background:rgba(255,255,255,.18);padding:.45em .8em;border-radius:999px;white-space:nowrap}
.cta .rechts svg{width:1em;height:1em}
.balken{display:flex;flex-direction:column;gap:var(--listenabst);background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:24px;padding:28px 32px}
.balken:empty,.notiz:empty,.liste:empty{display:none}
.bz{display:grid;grid-template-columns:var(--bname,260px) 1fr auto;gap:20px;align-items:center;font-size:var(--liste);font-weight:500}
.bz .spur{height:28px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bz .spur b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#14b8a6)}
.bz .spur b.rot{background:linear-gradient(90deg,#fb7185,#f43f5e)}
.bz .z{font-family:'JB';font-weight:700;white-space:nowrap}
.notiz{font-size:var(--fuss);color:#c3c6f2;line-height:1.35}
.wischen{display:none;align-self:flex-end;align-items:center;gap:.4em;font-size:var(--cta);font-weight:800;color:#7ee7d8}
.wischen svg{width:1em;height:1em}
.fuss{margin-top:var(--fussabst);display:flex;justify-content:center;gap:.8em;font-size:var(--fuss);color:#aeb2e6}
</style></head><body>
<div class="bg"></div><div class="raster"></div>
<div class="inhalt">
 <div class="kopf"><img src="logo-dark.svg" alt=""><span class="chip" id="chip"></span></div>
 <div class="mitte"><h1 id="titel"></h1><p class="unter" id="unter"></p><div class="liste" id="liste"></div><div class="balken" id="balken"></div><p class="notiz" id="notiz"></p></div>
 <div class="wischen" id="wischen">Weiter wischen <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
 <div class="cta" id="ctabox"><span class="links" id="cta"></span><span class="rechts">depiq.io <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
 <div class="fuss"><span>Keine Anlageberatung</span><span>·</span><span>Made in Stuttgart</span></div>
</div>
<script src="posts.js"></script>
<script>
const FORMATE={
 ig:'--w:1080px;--h:1350px;--pad:72px;--logo:70px;--chip:28px;--titel:116px;--abst:36px;--unter:42px;--unterbreite:900px;--liste:38px;--listenabst:18px;--ctapad:28px 28px;--ctarad:28px;--cta:34px;--ctaurl:28px;--fussabst:22px;--fuss:24px;--rasterweite:72px',
 x:'--w:1600px;--h:900px;--pad:64px;--logo:62px;--chip:26px;--titel:104px;--abst:26px;--unter:38px;--unterbreite:1300px;--liste:32px;--listenabst:12px;--ctapad:24px 30px;--ctarad:24px;--cta:36px;--ctaurl:28px;--fussabst:14px;--fuss:22px;--rasterweite:64px'
};
const ICONS={
 kopf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg>',
 gruender:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
 wissen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>',
 schmerz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
 loesung:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>',
 tipp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
 frage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>',
 geschenk:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
 kreuz:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 haken:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M5 12l5 5L20 7"/></svg>'
};
const GLOW={kopf:'rgba(225,29,72,.55)',schmerz:'rgba(225,29,72,.5)',standard:'rgba(18,150,140,.75)'};
const [postId,format]=location.hash.slice(1).split('/');
const p=POSTS[postId];
document.documentElement.setAttribute('style',FORMATE[format]+';--glow:'+(GLOW[p.saeule]||GLOW.standard));
document.getElementById('chip').innerHTML=ICONS[p.saeule]+p.chip;
document.getElementById('titel').innerHTML=(p.titel[format]||p.titel.ig).join('<br>');
document.getElementById('unter').innerHTML=p.unter;
const liste=format==='x'&&p.listeX===false?[]:p.liste||[];
document.getElementById('liste').innerHTML=liste.map((t,i)=>'<div class="punkt"><i'+(p.symbol==='kreuz'?' style="background:linear-gradient(135deg,#fb7185,#e11d48)"':'')+'>'+(p.nummeriert?(i+1):ICONS[p.symbol||'haken'])+'</i>'+t+'</div>').join('');
document.getElementById('balken').innerHTML=(p.balken||[]).map(b=>'<div class="bz"><span>'+b.name+'</span><div class="spur"><b class="'+(b.rot?'rot':'')+'" style="width:'+b.wert+'%"></b></div><span class="z">'+b.anzeige+'</span></div>').join('');
document.getElementById('notiz').innerHTML=p.notiz||'';
if(p.cta===false){document.getElementById('ctabox').style.display='none';document.getElementById('wischen').style.display='flex';}
document.getElementById('cta').innerHTML=ICONS.geschenk+(p.cta||'14 Tage MAX kostenlos testen');
</script>
</body></html>
