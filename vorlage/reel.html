<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Reel-Vorlage 1080 × 1920. Szenen stehen in reels.js. render(t) zeichnet den Zustand zum Zeitpunkt t (Sekunden),
     damit render-reel.js Bild für Bild aufnehmen kann. Sichere Zone: oben 220 px, unten 380 px frei (Instagram-Bedienelemente). -->
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(schrift/dm-sans-500.woff2)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(schrift/dm-sans-700.woff2)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
@font-face{font-family:'JB';font-weight:700;src:url(schrift/jetbrains-mono-700.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f1338}
body{font-family:'DM Sans',sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:-10%;background:
 radial-gradient(ellipse 60% 35% at var(--gx,15%) var(--gy,8%), rgba(124,92,230,.9), transparent 70%),
 radial-gradient(ellipse 60% 35% at 100% 100%, var(--glow,rgba(18,150,140,.75)), transparent 70%),
 linear-gradient(160deg,#1b1752 0%,#11143c 45%,#0d1636 100%)}
.kopf{position:absolute;top:150px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.kopf img{height:84px}
.szene{position:absolute;left:80px;right:110px;top:300px;bottom:420px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.zeile{font-size:var(--gr,128px);font-weight:800;line-height:1.02;letter-spacing:-.025em;will-change:transform,opacity}
.zeile em{font-style:normal;background:linear-gradient(90deg,#c4b5fd,#7ee7d8);-webkit-background-clip:text;color:transparent}
.zeile.rot{color:#fb7185}
.klein{font-size:52px;font-weight:500;color:#d4d6fb;line-height:1.3}
.zahl{font-family:'JB';font-weight:700}
.balken{display:flex;flex-direction:column;gap:34px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:32px;padding:44px}
.bz .kopfz{display:flex;justify-content:space-between;font-size:48px;font-weight:700;margin-bottom:16px}
.bz .spur{height:44px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bz .spur b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#14b8a6)}
.notiz{font-size:32px;color:#c3c6f2;line-height:1.35}
.cta{display:flex;flex-direction:column;gap:26px;align-items:flex-start}
.knopf{display:flex;align-items:center;gap:20px;font-size:54px;font-weight:800;padding:34px 44px;border-radius:32px;background:linear-gradient(90deg,#6d5ef5,#4f7be8 50%,#14b8a6);box-shadow:0 20px 70px rgba(20,184,166,.35)}
.knopf svg{width:60px;height:60px;flex:none}
.bio{font-size:50px;font-weight:700;color:#7ee7d8}
.fuss{position:absolute;left:80px;bottom:300px;font-size:30px;color:#aeb2e6}
</style></head><body>
<div class="bg" id="bg"></div>
<div class="kopf"><img src="logo-dark.svg" alt=""></div>
<div class="szene" id="szene"></div>
<div class="fuss">Keine Anlageberatung</div>
<script src="reels.js"></script>
<script>
const GESCHENK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';
const FOLGE='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>';
const R=REELS[location.hash.slice(1)];
const leicht=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const zahlFmt=n=>Math.round(n).toLocaleString('de-DE');
function render(t){
  const bg=document.getElementById('bg');
  bg.style.setProperty('--gx',(15+Math.sin(t*.5)*8)+'%'); bg.style.setProperty('--gy',(8+Math.cos(t*.4)*5)+'%');
  if(R.glow) bg.style.setProperty('--glow',R.glow);
  const s=R.szenen.find(s=>t>=s.von&&t<s.bis)||R.szenen[R.szenen.length-1];
  const lokal=t-s.von, dauer=s.bis-s.von;
  const aus=s===R.szenen[R.szenen.length-1]?1:leicht((s.bis-t)/0.35);
  let html='';
  (s.zeilen||[]).forEach((z,i)=>{
    const e=leicht((lokal-i*0.25)/0.45);
    html+='<div class="zeile '+(z.rot?'rot':'')+'" style="--gr:'+(s.groesse||128)+'px;opacity:'+(e*aus)+';transform:translateY('+((1-e)*60)+'px)">'+z.text+'</div>';
  });
  if(s.klein){const e=leicht((lokal-0.5)/0.5);html+='<div class="klein" style="opacity:'+(e*aus)+'">'+s.klein+'</div>';}
  if(s.balken){
    const e=leicht((lokal-0.3)/(dauer*0.6));
    html+='<div class="balken" style="opacity:'+aus+'">'+s.balken.map(b=>'<div class="bz"><div class="kopfz"><span>'+b.name+'</span><span class="zahl">'+zahlFmt(b.betrag*e)+' €</span></div><div class="spur"><b style="width:'+(b.wert*e)+'%"></b></div></div>').join('')+'</div>';
    if(s.notiz) html+='<div class="notiz" style="opacity:'+aus+'">'+s.notiz+'</div>';
  }
  if(s.cta){
    const e=leicht((lokal-0.4)/0.5), puls=1+Math.sin(Math.max(lokal-1,0)*4)*0.015;
    html+='<div class="cta"><div class="knopf" style="opacity:'+e+';transform:scale('+(e*puls)+')">'+(s.cta.startsWith('Folge')?FOLGE:GESCHENK)+s.cta+'</div><div class="bio" style="opacity:'+leicht((lokal-0.9)/0.5)+'">'+(s.bio||'Link in der Bio')+' <svg style="width:44px;height:44px;vertical-align:-6px" viewBox="0 0 24 24" fill="none" stroke="#7ee7d8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>';
  }
  document.getElementById('szene').innerHTML=html;
}
window.render=render; window.DAUER=R.dauer; render(0);
</script>
</body></html>
