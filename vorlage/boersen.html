<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Börsen-Frühstück für X, 1600 × 900. Daten kommen aus einer JSON-Datei (siehe render-boersen.js):
     { "datum":"Mo 02.11.2026", "stand":"Schlusskurse vom 30.10.2026",
       "indizes":[{"name":"DAX","wert":"25.818","prozent":-0.85}, … bis 6: DAX, S&P 500, Nasdaq 100, MSCI World, Gold, Bitcoin],
       "auswahl":"DAX 40 + Nasdaq 100",
       "gewinner":[{"name":"Siemens Energy","land":"🇩🇪","prozent":4.2}, … genau 5, land 🇩🇪 oder 🇺🇸],
       "verlierer":[{"name":"Zalando","prozent":-6.1}, … genau 5],
       "news":[{"wer":"EZB","text":"Europäische Zentralbank lässt den Leitzins bei 2,0 % unverändert"}, … 3 bis 4],
       "heute":"14:30 Uhr: Arbeitsmarktdaten USA",
       "einordnung":"Für Sparpläne: nichts tun. Ruhig bleiben." } -->
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(schrift/dm-sans-500.woff2)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(schrift/dm-sans-700.woff2)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
@font-face{font-family:'JB';font-weight:700;src:url(schrift/jetbrains-mono-700.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0a0d2c;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 45% 70% at 10% 0%,rgba(124,92,230,.7),transparent 70%),radial-gradient(ellipse 40% 70% at 96% 100%,rgba(20,184,166,.42),transparent 70%),linear-gradient(120deg,#0a0d2c,#16134a 60%,#0a1c33)}
.kopf{position:absolute;left:56px;right:56px;top:36px;display:flex;justify-content:space-between;align-items:center}
.kopf h1{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kopf h1 span{background:linear-gradient(90deg,#c4b5fd,#7ee7d8);-webkit-background-clip:text;color:transparent}
.kopf .d{font-size:24px;color:#c7cbf2;font-weight:700;margin-top:8px}
.kopf img{height:60px}
/* Indexleiste */
.idx{position:absolute;left:56px;right:56px;top:150px;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:12px}
.i{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 16px}
.i .n{font-size:20px;color:#c7cbf2;font-weight:700;white-space:nowrap}
.i .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.i .z{font-family:'JB';font-size:24px;white-space:nowrap}
.pc{font-size:22px;font-weight:800;white-space:nowrap}
.plus{color:#5eead4}.minus{color:#fda4af}.null{color:#c7cbf2}
/* linke Hälfte: Gewinner / Verlierer */
.links{position:absolute;left:56px;top:262px;width:720px;bottom:92px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column}
.box h2{font-size:24px;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:10px}
.box .aus{font-size:18px;color:#a9aed6;font-weight:700;margin:2px 0 4px}
.box h2 small{font-size:18px;color:#a9aed6;font-weight:700}
.box.g h2 b{color:#5eead4}.box.v h2 b{color:#fda4af}
.zeile{flex:1;display:flex;flex-direction:column;justify-content:center;border-top:1px solid rgba(255,255,255,.09)}
.zeile:first-of-type{border-top:0}
.zeile .o{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.zeile .a{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .pc{font-size:24px}
.zeile .a em{font-style:normal;margin-right:10px}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.g .bar i{background:linear-gradient(90deg,#14b8a6,#5eead4)}
.v .bar i{background:linear-gradient(90deg,#e11d48,#fda4af);margin-left:auto}
/* rechte Hälfte: News */
.rechts{position:absolute;left:800px;right:56px;top:262px;bottom:92px;display:flex;flex-direction:column;gap:14px}
.rechts h2{font-size:24px;font-weight:800;color:#e0e7ff}
.news{display:flex;flex-direction:column;gap:12px;flex:1}
.nw{flex:1;display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 18px}
.nw .w{flex:none;min-width:92px;text-align:center;font-size:18px;font-weight:800;padding:6px 10px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#14b8a6)}
.nw p{font-size:24px;font-weight:700;line-height:1.25}
.fuer{padding:14px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(99,102,241,.55),rgba(20,184,166,.4));border:1.5px solid rgba(255,255,255,.22)}
.fuer h3{font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#e0e7ff;margin-bottom:4px}
.fuer p{font-size:24px;font-weight:700;line-height:1.25}
.fuss{position:absolute;left:56px;right:56px;bottom:32px;display:flex;justify-content:space-between;align-items:center;font-size:20px;color:#a9aed6}
.fuss .heute{color:#fff;font-weight:700;font-size:22px} .fuss .heute span{color:#7ee7d8}
</style></head><body><div class="bg"></div>
<div class="kopf"><div><h1>☕ Börsen-<span>Frühstück</span></h1><div class="d" id="datum"></div></div><img src="logo-dark.svg" alt="depiq"></div>
<div class="idx" id="idx"></div>
<div class="links"><div class="box g" id="gew"></div><div class="box v" id="ver"></div></div>
<div class="rechts"><h2>📰 Was die Märkte bewegt</h2><div class="news" id="news"></div>
  <div class="fuer" id="fuer"><h3>Was heißt das für dich?</h3><p id="einordnung"></p></div></div>
<div class="fuss"><div class="heute" id="heute"></div><div id="stand"></div></div>
<script>
window.zeichne = d => {
  const f = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
  const k = n => n > 0.05 ? 'plus' : n < -0.05 ? 'minus' : 'null';
  const pf = n => ({ plus: '▲', minus: '▼', null: '■' })[k(n)];
  document.getElementById('datum').textContent = d.datum;
  const ix = document.getElementById('idx'); ix.style.setProperty('--n', d.indizes.length);
  ix.innerHTML = d.indizes.map(x => `<div class="i"><div class="n">${x.name}</div><div class="r"><span class="z">${x.wert}</span><span class="pc ${k(x.prozent)}">${pf(x.prozent)} ${f(x.prozent)}</span></div></div>`).join('');
  const max = Math.max(1, ...[...d.gewinner, ...d.verlierer].map(x => Math.abs(x.prozent)));
  const liste = (a) => a.map(x => `<div class="zeile"><div class="o"><span class="a">${x.land ? `<em>${x.land}</em>` : ''}${x.name}</span><span class="pc ${k(x.prozent)}">${f(x.prozent)}</span></div><div class="bar"><i style="width:${Math.abs(x.prozent) / max * 100}%"></i></div></div>`).join('');
  document.getElementById('gew').innerHTML = `<h2><b>▲</b> Top 5 Gewinner</h2><div class="aus">${d.auswahl}</div>` + liste(d.gewinner);
  document.getElementById('ver').innerHTML = `<h2><b>▼</b> Top 5 Verlierer</h2><div class="aus">${d.auswahl}</div>` + liste(d.verlierer);
  document.getElementById('news').innerHTML = d.news.map(n => `<div class="nw"><span class="w">${n.wer}</span><p>${n.text.replace(/ (%|\$|€|Uhr)/g, "\u00a0$1")}</p></div>`).join('');
  document.getElementById('einordnung').textContent = d.einordnung || '';
  document.getElementById('fuer').style.display = d.einordnung ? '' : 'none';
  document.getElementById('heute').innerHTML = d.heute ? `<span>Heute wichtig:</span> ${d.heute}` : '';
  document.getElementById('stand').textContent = (d.stand || '') + ' · Keine Anlageberatung';
};
</script></body></html>
