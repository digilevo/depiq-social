<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Börsen-Frühstück für X, 1600 × 900. Daten kommen aus einer JSON-Datei (siehe render-boersen.js):
     { "datum":"Mo 02.11.2026", "stand":"Schlusskurse vom 30.10.2026",
       "werte":[{"name":"DAX","wert":"23.450","prozent":-1.2}, … bis 5],
       "themen":["EZB lässt Leitzins unverändert", …bis 3], "heute":"Inflationsdaten USA, 14:30 Uhr", "einordnung":"Für Sparpläne: nichts tun. Ruhig bleiben." } -->
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(schrift/dm-sans-500.woff2)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(schrift/dm-sans-700.woff2)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
@font-face{font-family:'JB';font-weight:700;src:url(schrift/jetbrains-mono-700.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0a0d2c;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 45% 70% at 12% 0%,rgba(124,92,230,.75),transparent 70%),radial-gradient(ellipse 40% 70% at 95% 100%,rgba(20,184,166,.45),transparent 70%),linear-gradient(120deg,#0a0d2c,#16134a 60%,#0a1c33)}
.kopf{position:absolute;left:80px;right:80px;top:64px;display:flex;justify-content:space-between;align-items:center}
.kopf h1{font-size:64px;font-weight:800;letter-spacing:-.02em}
.kopf h1 span{background:linear-gradient(90deg,#c4b5fd,#7ee7d8);-webkit-background-clip:text;color:transparent}
.kopf .d{font-size:30px;color:#c7cbf2;font-weight:700;margin-top:6px}
.kopf img{height:74px}
.werte{position:absolute;left:80px;right:80px;top:250px;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:22px}
.w{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);border-radius:24px;padding:24px 26px}
.w .n{font-size:24px;color:#c7cbf2;font-weight:700}
.w .z{font-family:'JB';font-size:38px;margin:8px 0 10px;white-space:nowrap}
.w .p{display:inline-flex;align-items:center;gap:8px;font-size:28px;font-weight:800;padding:4px 14px;border-radius:999px}
.p.plus{color:#5eead4;background:rgba(20,184,166,.16)} .p.minus{color:#fda4af;background:rgba(225,29,72,.16)} .p.null{color:#c7cbf2;background:rgba(255,255,255,.08)}
.balken{height:8px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:16px;position:relative}
.balken i{position:absolute;top:0;bottom:0;border-radius:9px}
.themen{position:absolute;left:80px;right:720px;top:520px;display:flex;flex-direction:column;gap:16px}
.t{display:flex;gap:18px;align-items:center;font-size:32px;font-weight:700}
.t b{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#14b8a6);font-size:22px}
.fuer{position:absolute;right:80px;top:510px;width:600px;padding:26px 30px;border-radius:24px;background:linear-gradient(135deg,rgba(99,102,241,.55),rgba(20,184,166,.4));border:1.5px solid rgba(255,255,255,.22)}
.fuer h3{font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:#e0e7ff;margin-bottom:10px}
.fuer p{font-size:30px;font-weight:700;line-height:1.3}
.fuss{position:absolute;left:80px;right:80px;bottom:46px;display:flex;justify-content:space-between;font-size:22px;color:#a9aed6}
.fuss .heute{color:#fff;font-weight:700} .fuss .heute span{color:#7ee7d8}
</style></head><body><div class="bg"></div>
<div class="kopf"><div><h1>☕ Börsen-<span>Frühstück</span></h1><div class="d" id="datum"></div></div><img src="logo-dark.svg" alt="depiq"></div>
<div class="werte" id="werte"></div>
<div class="themen" id="themen"></div>
<div class="fuer" id="fuer"><h3>Was heißt das für dich?</h3><p id="einordnung"></p></div>
<div class="fuss"><div class="heute" id="heute"></div><div id="stand"></div></div>
<script>
window.zeichne = d => {
  const f = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
  document.getElementById('datum').textContent = d.datum;
  const w = document.getElementById('werte'); w.style.setProperty('--n', d.werte.length);
  const max = Math.max(1, ...d.werte.map(x => Math.abs(x.prozent)));
  w.innerHTML = d.werte.map(x => { const k = x.prozent > 0.05 ? 'plus' : x.prozent < -0.05 ? 'minus' : 'null';
    const breite = Math.abs(x.prozent) / max * 50, farbe = k === 'plus' ? '#14b8a6' : k === 'minus' ? '#e11d48' : '#94a3b8';
    const pos = x.prozent >= 0 ? `left:50%;width:${breite}%` : `right:50%;width:${breite}%`;
    return `<div class="w"><div class="n">${x.name}</div><div class="z">${x.wert}</div><span class="p ${k}">${k==='plus'?'▲':k==='minus'?'▼':'■'} ${f(x.prozent)}</span><div class="balken"><i style="${pos};background:${farbe}"></i></div></div>`; }).join('');
  document.getElementById('themen').innerHTML = d.themen.map((t, i) => `<div class="t"><b>${i + 1}</b>${t}</div>`).join('');
  document.getElementById('einordnung').textContent = d.einordnung || '';
  document.getElementById('fuer').style.display = d.einordnung ? '' : 'none';
  document.getElementById('heute').innerHTML = d.heute ? `<span>Heute wichtig:</span> ${d.heute}` : '';
  document.getElementById('stand').textContent = (d.stand || '') + ' · Keine Anlageberatung';
};
</script></body></html>
