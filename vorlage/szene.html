<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Emotions-Beitrag (1080 × 1350): großes Bild oben (Gefühl/Schmerz), kurzer Text unten (Lösung).
     Aufruf: szene.html?seite=N, Daten per window.zeichne(d): {serie, seiten:[{bild:'panik'|'ruhe'|..., titel, text, ton:'rot'|'gruen'}]} -->
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(schrift/dm-sans-500.woff2)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(schrift/dm-sans-700.woff2)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0a0d2c}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#0a0d2c,#16134a 60%,#0a1c33)}
.rot .bg{background:radial-gradient(ellipse 80% 55% at 50% 30%,rgba(225,29,72,.38),transparent 70%),linear-gradient(160deg,#1a0b1f,#16134a 60%,#0a0d2c)}
.gruen .bg{background:radial-gradient(ellipse 80% 55% at 50% 30%,rgba(20,184,166,.35),transparent 70%),linear-gradient(160deg,#0a0d2c,#16134a 60%,#0a1c33)}
.seite{position:absolute;inset:0;padding:56px 64px 52px;display:flex;flex-direction:column}
.kopf{display:flex;justify-content:space-between;align-items:center}
.serie{font-size:34px;font-weight:800;letter-spacing:.03em}
.rot .serie{color:#fda4af}.gruen .serie{color:#7ee7d8}
.kopf img{height:56px}
.bild{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.bild svg{width:960px;height:auto;max-height:100%}
.text{display:flex;flex-direction:column;gap:18px}
h1{font-size:84px;font-weight:800;line-height:1.02;letter-spacing:-.02em}
.rot h1 em{color:#fb7185;font-style:normal}.gruen h1 em{color:#5eead4;font-style:normal}
p{font-size:44px;font-weight:600;line-height:1.25;color:#e3e6ff}
.fuss{display:flex;justify-content:space-between;font-size:34px;color:#a9aed6;margin-top:26px}
.fuss b{color:#fff}
</style></head><body><div class="bg"></div>
<div class="seite"><div class="kopf"><span class="serie" id="serie"></span><img src="logo-dark.svg" alt="depiq"></div>
<div class="bild" id="bild"></div>
<div class="text"><h1 id="titel"></h1><p id="text"></p></div>
<div class="fuss"><span>Keine Anlageberatung</span><span id="nr"></span></div></div>
<script>
// Eigene Illustrationen (flach mit weichen Verläufen und Schatten, depiq-Farben). Figur „Max“: Anleger am Schreibtisch.
const DEFS = `<defs>
  <linearGradient id="hemd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  <linearGradient id="haut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9b8"/><stop offset="1" stop-color="#f0bb92"/></linearGradient>
  <linearGradient id="haar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3866"/><stop offset="1" stop-color="#2a1f3d"/></linearGradient>
  <linearGradient id="tisch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3486"/><stop offset="1" stop-color="#262061"/></linearGradient>
  <linearGradient id="screenRot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1235"/><stop offset="1" stop-color="#1b1240"/></linearGradient>
  <linearGradient id="screenGruen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2b3a"/><stop offset="1" stop-color="#131a45"/></linearGradient>
  <filter id="schatten" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
  <filter id="leuchtenRot"><feGaussianBlur stdDeviation="6"/></filter>
</defs>`;
const kopf = (gesicht) => `
  <ellipse cx="-92" cy="128" rx="16" ry="22" fill="url(#haut)"/><ellipse cx="92" cy="128" rx="16" ry="22" fill="url(#haut)"/>
  <circle cx="0" cy="118" r="92" fill="url(#haut)"/>
  <path d="M-94 112 Q-98 18 0 16 Q98 18 96 104 Q80 66 40 58 Q20 74 -14 66 Q-50 60 -72 80 Q-86 92 -94 112Z" fill="url(#haar)"/>
  <path d="M-30 40 Q0 28 34 36" stroke="#6b5a8a" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M-6 132 q6 14 0 22" stroke="#d99b74" stroke-width="5" fill="none" stroke-linecap="round"/>
  ${gesicht}`;
const figur = (stimmung) => {
  if (stimmung === 'panik') return `
  <g transform="translate(790,250)">
    <path d="M-150 470 Q-150 268 0 256 Q150 268 150 470 Z" fill="url(#hemd)" filter="url(#schatten)"/>
    <path d="M-30 262 L0 300 L30 262" fill="#c7d2fe"/>
    <rect x="-24" y="200" width="48" height="66" rx="18" fill="#f0bb92"/>
    ${kopf(`
      <ellipse cx="-34" cy="112" rx="24" ry="26" fill="#fff"/><ellipse cx="34" cy="112" rx="24" ry="26" fill="#fff"/>
      <circle cx="-34" cy="116" r="9" fill="#1e1b4b"/><circle cx="34" cy="116" r="9" fill="#1e1b4b"/>
      <path d="M-62 74 L-16 86 M62 74 L16 86" stroke="#2a1f3d" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="0" cy="178" rx="24" ry="30" fill="#7f1d1d"/><ellipse cx="0" cy="192" rx="14" ry="10" fill="#f87171"/>
      <path d="M96 56 q16 30 0 40 q-16 -10 0 -40Z" fill="#7dd3fc"/>
      <path d="M-110 86 q13 25 0 33 q-13 -8 0 -33Z" fill="#7dd3fc"/>`)}
    <path d="M-128 300 Q-170 220 -118 150" stroke="url(#hemd)" stroke-width="54" fill="none" stroke-linecap="round"/>
    <path d="M128 300 Q170 220 118 150" stroke="url(#hemd)" stroke-width="54" fill="none" stroke-linecap="round"/>
    <circle cx="-112" cy="140" r="32" fill="url(#haut)"/><circle cx="112" cy="140" r="32" fill="url(#haut)"/>
  </g>`;
  return `
  <g transform="translate(790,250)">
    <path d="M-150 470 Q-150 268 0 256 Q150 268 150 470 Z" fill="url(#hemd)" filter="url(#schatten)"/>
    <path d="M-30 262 L0 300 L30 262" fill="#c7d2fe"/>
    <rect x="-24" y="200" width="48" height="66" rx="18" fill="#f0bb92"/>
    ${kopf(`
      <path d="M-54 116 q20 -16 40 0 M14 116 q20 -16 40 0" stroke="#1e1b4b" stroke-width="8" fill="none" stroke-linecap="round"/>
      <ellipse cx="-58" cy="150" rx="16" ry="9" fill="#fb7185" opacity=".35"/><ellipse cx="58" cy="150" rx="16" ry="9" fill="#fb7185" opacity=".35"/>
      <path d="M-30 166 q30 26 60 0" stroke="#7f1d1d" stroke-width="9" fill="none" stroke-linecap="round"/>`)}
    <path d="M118 320 Q150 380 100 400" stroke="url(#hemd)" stroke-width="54" fill="none" stroke-linecap="round"/>
    <rect x="60" y="356" width="78" height="86" rx="14" fill="#fff" filter="url(#schatten)"/>
    <path d="M138 372 q34 10 0 46" stroke="#fff" stroke-width="12" fill="none"/>
    <circle cx="80" cy="400" r="30" fill="url(#haut)"/>
    <path d="M86 340 q14 -24 0 -48 M112 340 q14 -24 0 -48" stroke="#c7cbf2" stroke-width="7" fill="none" stroke-linecap="round" opacity=".8"/>
  </g>`;
};
const laptop = (ton) => {
  const rot = ton === 'rot';
  const farbe = rot ? '#fb7185' : '#5eead4';
  const linie = rot ? '70,120 140,140 200,110 270,215 320,195 390,300 430,330' : '70,320 130,270 180,300 240,210 290,240 350,150 430,100';
  const pfeil = rot ? 'M408 300 l26 34 l12 -44' : 'M396 92 l38 6 l-10 38';
  return `
  <g transform="translate(40,190)" filter="url(#schatten)">
    <rect x="0" y="0" width="500" height="380" rx="26" fill="#0b0f2e"/>
    <rect x="18" y="18" width="464" height="344" rx="16" fill="url(#${rot?'screenRot':'screenGruen'})"/>
    <g stroke="#ffffff" stroke-opacity=".07" stroke-width="2">
      <line x1="40" y1="100" x2="460" y2="100"/><line x1="40" y1="180" x2="460" y2="180"/><line x1="40" y1="260" x2="460" y2="260"/>
    </g>
    <polyline points="${linie}" fill="none" stroke="${farbe}" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" opacity=".35" filter="url(#leuchtenRot)"/>
    <polyline points="${linie}" fill="none" stroke="${farbe}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${pfeil}" fill="none" stroke="${farbe}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="34" width="${rot?190:200}" height="62" rx="14" fill="${farbe}" opacity=".18"/>
    <text x="58" y="80" font-family="DM Sans" font-weight="800" font-size="46" fill="${farbe}">${rot?'−20 %':'Wieder ↑'}</text>
    <path d="M-30 380 h560 l-30 34 h-500z" fill="#1e1b4b"/>
  </g>`;
};
const blase = (text, farbe) => `
  <g filter="url(#schatten)">
    <path d="M580 26 h460 a30 30 0 0 1 30 30 v84 a30 30 0 0 1 -30 30 h-190 l-46 48 v-48 h-224 a30 30 0 0 1 -30 -30 v-84 a30 30 0 0 1 30 -30Z" fill="#fff"/>
  </g>
  <text x="810" y="116" text-anchor="middle" font-family="DM Sans" font-weight="800" font-size="54" fill="${farbe}">${text}</text>`;
const deko = (ton) => ton === 'rot'
  ? `<g fill="#fb7185" opacity=".55"><path d="M610 300 l14 22 l-28 0z" transform="rotate(180 610 311)"/><path d="M1040 380 l12 20 l-24 0z" transform="rotate(180 1040 390)"/><path d="M560 470 l10 16 l-20 0z" transform="rotate(180 560 478)"/></g>`
  : `<g fill="#5eead4" opacity=".6"><circle cx="600" cy="320" r="8"/><circle cx="1050" cy="400" r="10"/><circle cx="570" cy="470" r="6"/></g>
     <g transform="translate(1000,560)"><rect x="-30" y="40" width="60" height="70" rx="10" fill="#4f46e5"/><path d="M0 40 Q-40 -10 -10 -60 Q0 -10 0 40 Q10 -30 40 -50 Q30 0 0 40" fill="#14b8a6"/></g>`;
const BILDER = {
  panik: `<svg viewBox="0 0 1100 760">${DEFS}${deko('rot')}${laptop('rot')}${figur('panik')}${blase('VERKAUFEN?!','#e11d48')}</svg>`,
  ruhe:  `<svg viewBox="0 0 1100 760">${DEFS}${deko('gruen')}${laptop('gruen')}${figur('ruhe')}${blase('Ich bleib dabei.','#0d9488')}</svg>`
};
const N = +(new URLSearchParams(location.search).get('seite') || 1);
window.zeichne = d => {
  const s = d.seiten[N-1];
  document.body.className = s.ton || '';
  document.getElementById('serie').textContent = s.serie || d.serie;
  document.getElementById('bild').innerHTML = BILDER[s.bild] || '';
  document.getElementById('titel').innerHTML = s.titel;
  document.getElementById('text').innerHTML = s.text;
  document.getElementById('nr').innerHTML = N < d.seiten.length ? `<b>Wischen ➜</b> ${N}/${d.seiten.length}` : `${N}/${d.seiten.length}`;
};
</script></body></html>
