<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Kopfbild (Profil-Titelbild) für das E-Book, heller Stil (ab 16.11.2026).
     Aufruf über render-kopfbild-buch.js: setzt Größe und sicheren Bereich je Kanal per window.zeichne(k). -->
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(schrift/dm-sans-500.woff2)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(schrift/dm-sans-700.woff2)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
*{box-sizing:border-box;margin:0}
html,body{overflow:hidden;font-family:'DM Sans',sans-serif;color:#1c1f3a}
.bg{position:absolute;inset:0;background:
 radial-gradient(45% 80% at 85% 35%,rgba(20,184,166,.24),transparent 70%),
 radial-gradient(55% 90% at 8% 100%,rgba(99,102,241,.20),transparent 70%),
 linear-gradient(120deg,#fbf7f1 0%,#f1f0ff 55%,#e6f7f4 100%)}
.sicher{position:absolute;display:flex;align-items:center}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.txt img{height:calc(var(--H)*.1);margin-bottom:calc(var(--H)*.05)}
h1{font-size:calc(var(--H)*var(--fs,.135));line-height:1.06;font-weight:800;letter-spacing:-.02em}
h1 em{white-space:nowrap;font-style:normal;background:linear-gradient(90deg,#4f46e5,#0f9f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
p{white-space:nowrap;font-size:calc(var(--H)*.062);color:#4a4f72;font-weight:500;margin-top:calc(var(--H)*.05);line-height:1.3}
.pill{margin-top:calc(var(--H)*.06);display:inline-flex;align-items:center;gap:.5em;background:#1c1f3a;color:#fff;font-weight:800;font-size:calc(var(--H)*.06);padding:.55em 1.1em;border-radius:999px}
.buch{flex:none;height:calc(var(--H)*.96);margin-left:calc(var(--H)*.12);filter:drop-shadow(0 calc(var(--H)*.05) calc(var(--H)*.07) rgba(28,31,90,.35))}
.kurz p{display:none}
p b{color:#0f9f8f;font-weight:800}
/* Aufbau X (16.11.2026, an echten Ausschnitten gemessen):
   Desktop: Profilbild links unten (Kreis bis etwa x 400, ab y 310).
   Handy: X schneidet links und rechts je etwa 125 px ab, oben liegt die Statusleiste (bis y 120),
   dazu Zurück-Knopf (x 170–290, y 195–310) und Suche (x 1205–1330, y 195–310).
   Daher: Inhalt nur im Feld x 430–1195, y 125–490. Links füllt eine Zinseszins-Kurve als Schmuck die Fläche;
   sie darf abgeschnitten oder verdeckt werden. */
.lay-x .sicher{display:block}
.lay-x .txt{position:absolute;inset:0;display:block}
.lay-x .txt img{position:absolute;left:430px;top:128px;height:56px;margin:0}
.lay-x h1{position:absolute;left:430px;top:200px;font-size:50px;width:500px}
.lay-x p{position:absolute;left:430px;top:340px;font-size:23px;margin:0}
.lay-x .pill{position:absolute;left:430px;top:388px;margin:0;font-size:25px}
.lay-x .buch{position:absolute;left:930px;top:122px;height:372px;margin:0}
.deko{display:none}
.lay-x.deko-kurve .deko{display:block;position:absolute;left:0;top:0;width:1500px;height:500px}
.seiten{display:none}
.deko-seiten .seiten{display:block;position:absolute;left:0;top:0;width:470px;height:500px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 92%);mask-image:linear-gradient(90deg,#000 45%,transparent 92%)}
.seiten img{position:absolute;width:210px;border-radius:8px;box-shadow:0 10px 24px rgba(28,31,90,.22);opacity:.9}
.seiten img{opacity:.75}
</style></head><body><div class="bg"></div>
<svg class="deko" viewBox="0 0 1500 500" aria-hidden="true"><defs><linearGradient id="kv" x1="0" x2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".15"/><stop offset="1" stop-color="#14b8a6" stop-opacity=".55"/></linearGradient>
<linearGradient id="kf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#14b8a6" stop-opacity=".16"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs>
<path d="M-20 300 C 120 295, 260 270, 360 215 S 395 110, 390 60 L 390 500 L -20 500 Z" fill="url(#kf)"/>
<path d="M-20 300 C 120 295, 260 270, 360 215 S 395 110, 390 60" fill="none" stroke="url(#kv)" stroke-width="10" stroke-linecap="round"/>
<g fill="#6366f1" opacity=".16"><rect x="60" y="230" width="40" height="70" rx="10"/><rect x="130" y="200" width="40" height="100" rx="10"/><rect x="200" y="160" width="40" height="140" rx="10"/><rect x="270" y="110" width="40" height="190" rx="10"/></g></svg>
<div class="seiten"><img src="../buch/umschlag/seite-007.png" style="left:-30px;top:40px;transform:rotate(-8deg)"><img src="../buch/umschlag/seite-113.png" style="left:110px;top:10px;transform:rotate(4deg)"><img src="../buch/umschlag/seite-434.png" style="left:230px;top:70px;transform:rotate(-3deg)"></div>
<div class="sicher" id="s"><div class="txt"><img src="logo-light.svg" alt="depiq">
<h1>Finanzielle Freiheit ist <em>kein Zufall.</em></h1>
<p>Mein Buch · 586 Seiten · <b>als E-Book kostenlos</b></p>
<span class="pill">📘 depiq.io/de/book</span></div>
<img class="buch" src="../buch/umschlag/buch-3d-ebook-zugeschnitten.png" alt=""></div>
<script>
window.zeichne=k=>{document.body.style.width=k.w+'px';document.body.style.height=k.h+'px';
const s=document.getElementById('s');Object.assign(s.style,{left:k.s[0]+'px',top:k.s[1]+'px',width:k.s[2]+'px',height:k.s[3]+'px'});
s.style.setProperty('--H',k.s[3]+'px');if(k.fs)s.style.setProperty('--fs',k.fs);if(k.kurz)document.body.classList.add('kurz');if(k.lay)document.body.classList.add('lay-'+k.lay);if(k.deko)document.body.classList.add('deko-'+k.deko);};
</script></body></html>
