<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- YouTube-Kanalbild 2560 × 1440. Auf allen Geräten sichtbar ist nur die Mitte 1546 × 423 – dort steht alles Wichtige.
     Farben, Schrift und Chips wie im Facebook- und X-Titelbild. -->
<style>
@font-face{font-family:'DM Sans';font-weight:700;src:url(schrift/dm-sans-700.woff2)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:2560px;height:1440px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;position:relative;background:#0a0d2c}
em{font-style:normal;background:linear-gradient(90deg,#c4b5fd,#7ee7d8);-webkit-background-clip:text;color:transparent}
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 30% 40% at 30% 35%, rgba(124,92,230,.85), transparent 70%),
 radial-gradient(ellipse 25% 35% at 60% 60%, rgba(99,102,241,.35), transparent 70%),
 radial-gradient(ellipse 30% 40% at 78% 70%, rgba(20,184,166,.55), transparent 70%),
 linear-gradient(115deg,#0a0d2c,#17134d 55%,#0a1c33)}
.raster{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 40% 40% at 50% 50%,#000,transparent 75%)}
.mitte{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:space-between;gap:60px;padding:0 30px}
.logo{height:130px;display:block}
h1{font-size:72px;line-height:1.05;font-weight:800;letter-spacing:-.025em;margin-top:20px;white-space:nowrap}
.chips{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.chip{display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:700;padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);color:#e6e8ff;white-space:nowrap}
.chip.g{background:rgba(20,184,166,.16);border-color:rgba(45,212,191,.55);color:#c7f5ec}
.chip i{width:14px;height:14px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 14px #2dd4bf}
</style></head><body><div class="bg"></div><div class="raster"></div>
<div class="mitte">
  <div><img class="logo" src="logo-dark.svg" alt="depiq"><h1>Dein Depot.<br><em>Endlich verständlich.</em></h1></div>
  <div class="chips">
    <span class="chip g"><i></i>Kurz erklärt, ohne Fachchinesisch</span>
    <span class="chip">📊 Depot-Wissen in Kurzvideos</span>
    <span class="chip">🎬 Neue Shorts jede Woche</span>
  </div>
</div></body></html>
