<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Titelbilder für depiq Wissen. Aufruf: wissen-titelbild.html?motiv=etf|zins|notgroschen
     Ohne Text im Bild (gilt für DE und EN), nur Logo. Wichtiges liegt im mittleren Band,
     damit der Zuschnitt 1200 × 630 (Vorschau beim Teilen) nichts abschneidet. -->
<style>
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0d2c}
svg.motiv{position:absolute;inset:0;width:100%;height:100%}
.logo{position:absolute;right:4%;bottom:6%;height:7.5vh;opacity:.95}
</style></head><body>
<svg class="motiv" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d2c"/><stop offset=".55" stop-color="#17134d"/><stop offset="1" stop-color="#0a1c33"/></linearGradient>
 <radialGradient id="g1" cx=".2" cy=".15" r=".55"><stop offset="0" stop-color="#7c5ce6" stop-opacity=".7"/><stop offset="1" stop-color="#7c5ce6" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2" cx=".85" cy=".85" r=".5"><stop offset="0" stop-color="#14b8a6" stop-opacity=".45"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
 <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5b5ce6"/><stop offset="1" stop-color="#7ee7d8"/></linearGradient>
 <linearGradient id="schild" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ee7d8"/><stop offset="1" stop-color="#0f9e8f"/></linearGradient>
 <radialGradient id="ball" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#dfe3ff"/><stop offset="1" stop-color="#a5a9e8"/></radialGradient>
 <linearGradient id="hang" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2580"/><stop offset="1" stop-color="#16124a"/></linearGradient>
 <filter id="schatten"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#g1)"/><rect width="1600" height="900" fill="url(#g2)"/>
<g id="inhalt"></g>
</svg>
<img class="logo" src="logo-dark.svg" alt="">
<script>
const m=new URLSearchParams(location.search).get('motiv')||'etf';
const g=document.getElementById('inhalt');
const S=(s)=>g.insertAdjacentHTML('beforeend',s);
if(m==='etf'){
 // Kalender mit Wiederholungspfeil (monatlich automatisch)
 S(`<g transform="translate(250,300)" filter="url(#schatten)">
   <rect width="210" height="200" rx="28" fill="#fff"/><rect width="210" height="58" rx="28" fill="#5b5ce6"/><rect y="30" width="210" height="28" fill="#5b5ce6"/>
   <rect x="48" y="-16" width="16" height="44" rx="8" fill="#c4b5fd"/><rect x="146" y="-16" width="16" height="44" rx="8" fill="#c4b5fd"/>
   <g fill="#e3e6ff">${[0,1,2,3].map(r=>[0,1,2,3,4].map(c=>`<rect x="${22+c*35}" y="${78+r*28}" width="24" height="18" rx="5"/>`).join('')).join('')}</g>
   <rect x="22" y="78" width="24" height="18" rx="5" fill="#0f9e8f"/>
   <path d="M150 230 a70 70 0 1 1 52-118" fill="none" stroke="#7ee7d8" stroke-width="12" stroke-linecap="round"/>
   <path d="M210 92 l-6 34 -32 -12" fill="none" stroke="#7ee7d8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>`);
 // Münzen fallen in die erste Stufe
 [0,1,2].forEach(i=>S(`<g transform="translate(${560+i*14},${230+i*70})" opacity="${1-i*.22}"><circle r="26" fill="#f5b942"/><circle r="17" fill="none" stroke="#c98a12" stroke-width="4"/></g>`));
 // fünf Stufen
 const h=[150,220,300,390,490];
 h.forEach((v,i)=>{const x=620+i*150,y=760-v;
  S(`<g filter="url(#schatten)"><rect x="${x}" y="${y}" width="118" height="${v}" rx="22" fill="url(#bar)" opacity="${.75+i*.06}"/></g>
     <circle cx="${x+59}" cy="${y+50}" r="30" fill="rgba(255,255,255,.18)"/>
     <text x="${x+59}" y="${y+62}" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="800" font-size="34" fill="#fff">${i+1}</text>`)});
 // Weltkugel aus vielen Punkten über der letzten Stufe (viele Unternehmen)
 let d='';const cx=1279,cy=170,R=105;
 for(let a=-90;a<=90;a+=15){const rr=R*Math.cos(a*Math.PI/180),yy=cy+R*Math.sin(a*Math.PI/180);const n=Math.max(1,Math.round(rr/14));
  for(let k=0;k<n*2;k++){const t=k/(n*2)*Math.PI*2,xx=cx+rr*Math.cos(t);if(Math.sin(t)<0)continue;d+=`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="${(4+3*Math.sin(t)).toFixed(1)}" fill="${(k+a)%3?'#c4b5fd':'#7ee7d8'}"/>`}}
 S(`<circle cx="${cx}" cy="${cy}" r="${R+18}" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>${d}`);
 S(`<path d="M640 590 C 820 520, 1000 420, 1200 300" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-dasharray="4 16" stroke-linecap="round"/>`);
}
if(m==='zins'){
 // Hang
 S(`<path d="M0 230 C 500 300, 900 520, 1600 760 L1600 900 L0 900 Z" fill="url(#hang)"/>
    <path d="M0 230 C 500 300, 900 520, 1600 760" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4"/>`);
 // Spur
 S(`<path d="M150 252 C 520 320, 880 510, 1230 640" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="26" stroke-linecap="round"/>`);
 // wachsende Schneebälle entlang des Hangs
 const P=t=>{const x=t*1600;const y=230+ (Math.pow(t,1.5))*560;return [x,y]};
 const balls=[[.10,14],[.22,22],[.34,34],[.46,52],[.58,78],[.72,118]];
 balls.forEach(([t,r],i)=>{const [x,y]=P(t);const last=i===balls.length-1;
  S(`<g ${last?'filter="url(#schatten)"':''} opacity="${last?1:.35+i*.1}"><circle cx="${x}" cy="${y-r-2}" r="${r}" fill="url(#ball)"/>
  ${last?`<path d="M${x-r*.55} ${y-r*1.45} q ${r*.3} ${-r*.2} ${r*.6} 0" stroke="#a5a9e8" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M${x+r*.1} ${y-r*.7} q ${r*.3} ${r*.2} ${r*.5} 0" stroke="#a5a9e8" stroke-width="6" fill="none" stroke-linecap="round"/>`:''}</g>`)});
 // ansteigende Kurve als Andeutung des Zinseszinses
 let p='';for(let i=0;i<=40;i++){const t=i/40;p+=(i?'L':'M')+(170+t*1150).toFixed(0)+' '+(440-Math.pow(t,2.6)*360).toFixed(0)+' '}
 S(`<path d="${p}" fill="none" stroke="#7ee7d8" stroke-width="8" stroke-linecap="round" opacity=".9"/>
    <path d="M170 440 L1320 300" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round" opacity=".8"/>
    <circle cx="1320" cy="80" r="16" fill="#7ee7d8"/><circle cx="1320" cy="300" r="12" fill="#c4b5fd"/>`);
 // Schneeflocken
 [[300,120],[620,90],[930,160],[1450,130],[1120,220],[480,200]].forEach(([x,y])=>S(`<circle cx="${x}" cy="${y}" r="5" fill="rgba(255,255,255,.5)"/>`));
}
if(m==='notgroschen'){
 // Regen und Blitze von oben
 for(let i=0;i<34;i++){const x=200+((i*137)%1200),y=40+((i*71)%170);S(`<path d="M${x} ${y} l-14 34" stroke="rgba(196,181,253,.45)" stroke-width="5" stroke-linecap="round"/>`)}
 S(`<path d="M430 120 l-50 110 h46 l-34 100 l100 -140 h-50 l38 -70 z" fill="#f5b942" opacity=".85"/>
    <path d="M1190 90 l-40 90 h38 l-28 84 l82 -116 h-42 l32 -58 z" fill="#f5b942" opacity=".7"/>`);
 // Schirmbogen / Schutzzone
 S(`<path d="M520 560 A280 280 0 0 1 1080 560" fill="none" stroke="rgba(126,231,216,.35)" stroke-width="10" stroke-dasharray="2 22" stroke-linecap="round"/>`);
 // Schild mit Münzstapel
 S(`<g filter="url(#schatten)" transform="translate(800,520)">
   <path d="M0 -230 L190 -160 C190 20 120 140 0 210 C-120 140 -190 20 -190 -160 Z" fill="url(#schild)"/>
   <path d="M0 -200 L160 -142 C160 8 100 112 0 172 C-100 112 -160 8 -160 -142 Z" fill="rgba(255,255,255,.14)"/>
   ${[0,1,2,3].map(i=>`<ellipse cx="0" cy="${70-i*34}" rx="78" ry="22" fill="#c98a12"/><rect x="-78" y="${48-i*34}" width="156" height="22" fill="#c98a12"/><ellipse cx="0" cy="${48-i*34}" rx="78" ry="22" fill="#f5b942"/>`).join('')}
   <text x="0" y="-40" text-anchor="middle" font-family="DM Sans,sans-serif" font-weight="800" font-size="38" fill="#c98a12">€</text></g>`);
 // Alltags-Pannen links und rechts: Waschmaschine, Auto, Rechnung
 S(`<g transform="translate(230,560)" opacity=".9"><rect width="150" height="170" rx="20" fill="#e3e6ff"/><rect x="0" y="0" width="150" height="38" rx="20" fill="#c4b5fd"/><rect y="20" width="150" height="18" fill="#c4b5fd"/>
     <circle cx="75" cy="108" r="46" fill="#5b5ce6"/><circle cx="75" cy="108" r="30" fill="#8fd9ff" opacity=".8"/><circle cx="122" cy="19" r="7" fill="#fff"/></g>
    <g transform="translate(1190,600)" opacity=".9"><path d="M10 70 l30 -50 h110 l30 50 z" fill="#c4b5fd"/><rect x="0" y="66" width="190" height="58" rx="16" fill="#e3e6ff"/>
     <circle cx="45" cy="128" r="22" fill="#5b5ce6"/><circle cx="145" cy="128" r="22" fill="#5b5ce6"/>
     <path d="M170 10 l26 26 m-6 -34 a20 20 0 1 0 14 14" stroke="#f5b942" stroke-width="10" stroke-linecap="round" fill="none"/></g>
    <g transform="translate(1380,420) rotate(8)" opacity=".85"><rect width="120" height="150" rx="14" fill="#fff"/>
     ${[0,1,2,3].map(i=>`<rect x="18" y="${28+i*24}" width="${i==3?50:84}" height="10" rx="5" fill="#c4c8ea"/>`).join('')}<rect x="60" y="118" width="42" height="14" rx="7" fill="#e5484d"/></g>`);
}
</script></body></html>
