<!doctype html><html lang="de"><head><meta charset="utf-8">
<!-- Karussell „Börsenwort einfach erklärt“ (Instagram-Karussell 1080 × 1350, TikTok-Fotostrecke, X-Bild).
     Aufruf: karussell.html?seite=N ; Daten per window.zeichne(d), siehe render-karussell.js.
     Lesbarkeit: kleinste Schrift 36 px (am Handy etwa 13 px), Fließtext 44 px, Titel ab 64 px. -->
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(schrift/dm-sans-500.woff2)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(schrift/dm-sans-700.woff2)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(schrift/dm-sans-800.woff2)}
@font-face{font-family:'JB';font-weight:700;src:url(schrift/jetbrains-mono-700.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0a0d2c}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 10% 0%,rgba(124,92,230,.7),transparent 70%),radial-gradient(ellipse 70% 40% at 96% 100%,rgba(20,184,166,.42),transparent 70%),linear-gradient(160deg,#0a0d2c,#16134a 60%,#0a1c33)}
.seite{position:absolute;inset:0;padding:60px 64px 52px;display:flex;flex-direction:column;gap:34px}
.kopf{display:flex;justify-content:space-between;align-items:center}
.serie{font-size:36px;font-weight:800;color:#7ee7d8;letter-spacing:.02em}
.kopf img{height:58px}
.links{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pille{display:none;align-items:center;gap:12px;font-size:32px;font-weight:800;padding:10px 22px;border-radius:999px;border:2px solid var(--tf);background:color-mix(in srgb,var(--tf) 22%,transparent);color:#fff}
.pille svg{width:34px;height:34px}
.akzent{display:none;position:absolute;left:0;right:0;top:0;height:8px;background:var(--tf)}
.inhalt{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:30px;overflow:hidden}
h1{font-size:118px;font-weight:800;line-height:1.02;letter-spacing:-.02em}
h2{font-size:64px;font-weight:800;line-height:1.08;letter-spacing:-.01em}
h1 em,h2 em{font-style:normal;background:linear-gradient(90deg,#c4b5fd,#7ee7d8);-webkit-background-clip:text;color:transparent}
p{font-size:44px;font-weight:500;line-height:1.3;color:#e3e6ff}
p b{color:#fff;font-weight:800}
.unter{font-size:50px;color:#c7cbf2;font-weight:700}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.box{border-radius:30px;padding:30px 30px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:14px}
.box .sym{font-size:72px;line-height:1}
.box h3{font-size:46px;font-weight:800}
.box p{font-size:40px}
.box.a{border-color:rgba(94,234,212,.5)} .box.a h3{color:#5eead4}
.box.b{border-color:rgba(196,181,253,.55)} .box.b h3{color:#c4b5fd}
.hinweis{border-radius:28px;padding:26px 32px;background:linear-gradient(135deg,rgba(99,102,241,.6),rgba(20,184,166,.45));border:2px solid rgba(255,255,255,.22)}
.hinweis p{font-size:42px;color:#fff;font-weight:700}
.balken{display:flex;flex-direction:column;gap:22px}
.bz .l{display:flex;justify-content:space-between;font-size:42px;font-weight:700;margin-bottom:10px}
.bz .l span:last-child{font-family:'JB';white-space:nowrap;margin-left:20px}
.bz .s{height:44px;border-radius:14px;background:rgba(255,255,255,.08);overflow:hidden}
.bz .s i{display:block;height:100%;border-radius:14px}
.fuss{display:flex;justify-content:space-between;align-items:center;font-size:36px;color:#a9aed6;font-weight:500}
.weiter{color:#fff;font-weight:800}
.marken{display:flex;gap:18px;flex-wrap:wrap}.marken span{font-size:40px;font-weight:800;padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18)}
.zahl{display:flex;align-items:center;gap:26px;padding:26px 32px;border-radius:28px;background:rgba(20,184,166,.14);border:2px solid rgba(94,234,212,.45)}.zahl b{font-family:'JB';font-size:76px;color:#5eead4;white-space:nowrap}.zahl span{font-size:40px;font-weight:700;line-height:1.2}
.cta{display:flex;flex-direction:column;gap:10px;padding:26px 32px;border-radius:28px;background:#fff;color:#16134a}.cta strong{font-size:44px;font-weight:800}.cta span{font-size:38px;font-weight:700;color:#4f46e5}
/* Design-Variante „hell“ (Test ab 16.11.2026, Jürgen 11.11.: „Pinterest liest sich besser“). Aktiv mit "design":"hell" im JSON. Grundvorlage bleibt dunkel. */
html.hell body{color:#1c1f3a;background:#fbf7f1}
html.hell .bg{background:radial-gradient(ellipse 80% 35% at 0% 0%,rgba(196,181,253,.45),transparent 70%),radial-gradient(ellipse 70% 30% at 100% 100%,rgba(94,234,212,.35),transparent 70%),#fbf7f1}
html.hell .serie{color:#0f766e}
html.hell .pille svg{stroke:var(--tf)}
html.hell .pille{color:var(--tf);background:color-mix(in srgb,var(--tf) 12%,#fff)}
html.hell h1 em,html.hell h2 em{background:none;-webkit-background-clip:initial;color:#4f46e5}
html.hell p{color:#33385c} html.hell p b{color:#1c1f3a}
html.hell .unter{color:#4a4f72}
html.hell .box{background:#fff;border-color:rgba(28,31,58,.08);box-shadow:0 14px 40px rgba(28,31,58,.08)}
html.hell .box.a{border-color:rgba(13,148,136,.45)} html.hell .box.a h3{color:#0f766e}
html.hell .box.b{border-color:rgba(79,70,229,.4)} html.hell .box.b h3{color:#4f46e5}
html.hell .hinweis{background:linear-gradient(135deg,#4f46e5,#0f766e);border-color:transparent}
html.hell .hinweis p{color:#fff}
html.hell .bz .s{background:#e7e9f3}
html.hell .fuss{color:#4a4f72} html.hell .weiter{color:#1c1f3a}
html.hell .marken span{background:#fff;border-color:rgba(28,31,58,.12)}
html.hell .zahl{background:#e6f7f4;border-color:rgba(13,148,136,.45)} html.hell .zahl b{color:#0f766e}
html.hell .cta{background:#1c1f3a;color:#fff} html.hell .cta span{color:#5eead4}
html.hell [style*="color:#c7cbf2"],html.hell [style*="color: #c7cbf2"],html.hell [style*="color:#a9aed6"]{color:#4a4f72!important}
html.hell [style*="color:#fff"]{color:#1c1f3a!important}
html.hell [style*="color:#5eead4"],html.hell [style*="color:#7ee7d8"]{color:#0f766e!important}
</style></head><body><div class="bg"></div>
<div class="akzent" id="akzent"></div><div class="seite"><div class="kopf"><div class="links"><span class="pille" id="pille"></span><span class="serie" id="serie"></span></div><img id="logo" src="logo-dark.svg" alt="depiq"></div>
<div class="inhalt" id="inhalt"></div>
<div class="fuss"><span id="links">Keine Anlageberatung</span><span id="rechts"></span></div></div>
<script>
const N = +(new URLSearchParams(location.search).get('seite') || 1);
window.zeichne = d => {
  const s = d.seiten[N - 1];
  if (d.design === 'hell') { document.documentElement.classList.add('hell'); document.getElementById('logo').src = 'logo-light.svg'; }
  document.getElementById('serie').textContent = d.serie;
  if (d.thema) { // Themenwelt (RICHTLINIEN §7): {name, farbe, symbol(svg-Pfad)}
    document.documentElement.style.setProperty('--tf', d.thema.farbe);
    const pi = document.getElementById('pille'); pi.style.display = 'inline-flex';
    pi.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d.thema.symbol}"/></svg>${d.thema.name}`;
    document.getElementById('akzent').style.display = 'block';
  }
  document.getElementById('inhalt').innerHTML = s.html;
  document.getElementById('rechts').innerHTML = N < d.seiten.length ? `<span class="weiter">Wischen ➜</span> ${N}/${d.seiten.length}` : `${N}/${d.seiten.length}`;
};
</script></body></html>
